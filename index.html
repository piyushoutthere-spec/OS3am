<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>shadow os</title>
        <link rel="stylesheet" href="os.css">
    </head>

    <body>
        <!--main desktop -->
        <main class="desktop">

            <!--top navigation bar-->
            <header class="topbar">

                <div class="logo">
                    SHADOW OS
                </div>

                <div class="systeminfo">
                    <span id="date"></span>
                    <span id="time"></span>
                </div>
            </header>

            <section class="desktop-area">

                <!--desktop application shortcuts-->
                <div class="desktopicons">

                    <div class="appicon" data-app="Files">
                        <img src="assets/folder.svg" alt="Files">
                        <span>Files</span>
                    </div>

                    <div class="appicon" data-app="Notes">
                        <img src="assets/notebook-pen.svg" alt="Notes">
                        <span>Notes</span>
                    </div>

                    <div class="appicon" data-app="Terminal">
                        <img src="assets/square-terminal.svg" alt="Terminal">
                        <span>Terminal</span>
                    </div>

                    <div class="appicon" data-app="Calculator">
                        <img src="assets/calculator.svg" alt="Calculator">
                        <span>Calculator</span>
                    </div>

                    <div class="appicon" data-app="Settings">
                        <img src="assets/settings.svg" alt="Setting">
                        <span>Settings</span>
                    </div>
                </div>
            </section>

            <!--application windows-->
            <div id="window-container"></div>

            <!--bottom application dock-->
            <nav class="dock">

                <div class="dockitems" data-app="Files">
                    <img src="assets/folder.svg" alt="files">
                </div>

                <div class="dockitems" data-app="Notes">
                    <img src="assets/notebook-pen.svg" alt="notes">
                </div>

                <div class="dockitems" data-app="Terminal">
                    <img src="assets/square-terminal.svg" alt="terminal">
                </div>

                <div class="dockitems" data-app="Calculator">
                    <img src="assets/calculator.svg" alt="calculator">
                </div>

                <div class="dockitems" data-app="Settings">
                    <img src="assets/settings.svg" alt="settings">
                </div>
            </nav>
        </main>

        <script src="ps.js"></script>
    </body>
</html>
