<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>shadow os</title>
        <link rel="stylesheet" href="os.css">
    </head>

    <body>
        <!--main desktop -->
        <main class="desktop">

            <!--top navigation bar-->
            <header class="topbar">

                <div class="logo">
                    SHADOW OS
                </div>

                <div class="systeminfo">
                    <span id="date"></span>
                    <span id="time"></span>
                </div>
            </header>

            <section class="desktop-area">

                <!--desktop application shortcuts-->
                <div class="desktopicons">

                    <div class="appicon">
                        <img src="assets/folder.svg" alt="Files">
                        <span>Files</span>
                    </div>

                    <div class="appicon">
                        <img src="assets/notebook-pen.svg" alt="Notes">
                        <span>Notes</span>
                    </div>

                    <div class="appicon">
                        <img src="assets/square-terminal.svg" alt="Terminal">
                        <span>Terminal</span>
                    </div>

                    <div class="appicon">
                        <img src="assets/calculator.svg" alt="calculator">
                        <span>Calculator</span>
                    </div>

                    <div class="appicon">
                        <img src="assets/settings.svg" alt="setting">
                        <span>Settings</span>
                    </div>
                </div>
            </section>
        </main>

        <script src="ps.js"></script>
    </body>
</html>
